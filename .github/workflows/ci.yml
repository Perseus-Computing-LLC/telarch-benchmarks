name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace --verbose
      - name: Run unit and integration tests
        run: cargo test --workspace --verbose
      - name: Run benchmark harness
        run: cargo run --release -p perseus-benchmarks
      - name: Run swarm partition harness
        run: cargo run --release -p perseus-benchmarks --bin swarm_partition
