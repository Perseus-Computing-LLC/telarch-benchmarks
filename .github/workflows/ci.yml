name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Check, Test, Clippy, and Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-10-25
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # The gap scripts import the Python packages of the libraries; install them at the release the
        # vendored Rust sources come from (outside a telarch-suite checkout there are no sibling repositories).
        # kibisis 0.1.0a12 needs the kibisis_native extension (no pure-Python lease fallback); both come from
        # the attested release wheels so the install does not depend on PyPI.
        run: |
          python -m pip install --upgrade pip
          pip install pydantic cryptography sqlcipher3-binary pytest hatchling
          pip install \
            "harpe @ git+https://github.com/Perseus-Computing-LLC/harpe@v0.1.0-alpha.11" \
            "kibisis-native @ https://github.com/Perseus-Computing-LLC/kibisis/releases/download/v0.1.0-alpha.12/kibisis_native-0.1.0a12-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl#sha256=e42f1a3d711f66232f85c20811c2beccb615bef34caffc746dcd1afddcb07c89" \
            "kibisis @ https://github.com/Perseus-Computing-LLC/kibisis/releases/download/v0.1.0-alpha.12/kibisis-0.1.0a12-py3-none-any.whl#sha256=6be43901b70d507481820d37761bea2c682a8133779aff0c64e444ef59aceeb7" \
            "argus-ledger @ git+https://github.com/Perseus-Computing-LLC/argus@v0.1.0-alpha.8"

      - name: Check formatting
        # This repository's code only; the vendored crates are formatted as upstream released them.
        run: cargo fmt -p telarch-benchmarks -- --check

      - name: Clippy linter
        # --no-deps: the vendored crates are unmodified upstream releases; lint this repository's code.
        run: cargo clippy --all-targets -p telarch-benchmarks --no-deps -- -D warnings

      - name: Vendored crate versions match claims.json
        run: python scripts/vendor_check.py

      - name: README numbers match claims.json
        run: python scripts/claims_check.py

      - name: claims.json has not regressed against baselines/ (committed figures, same host)
        run: python scripts/drift_check.py

      - name: Harness unit tests (bisect-bench, drift-check)
        run: python -m pytest scripts/tests -q

      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

      - name: Run benchmark execution & claims regeneration
        # Runs every program on the shared runner and rebuilds claims.json from those reports, which are
        # not committed. The published figures are on telarch.ai/evidence.
        run: |
          make bench

  memory-evals:
    name: Memory evaluations (offline tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install telarch-evals
        run: |
          python -m pip install --upgrade pip
          pip install -e "evals[test]"

      - name: Offline tests
        # Fake models only. The tests marked network fetch the pinned upstream files; run them with make evals-test.
        run: python -m pytest evals/tests -q -m "not network"
