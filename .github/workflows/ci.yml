name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Check, Test, Clippy, and Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # The gap scripts import the Python packages of the libraries; install them at the release tag the
        # vendored Rust sources come from (outside a telarch-suite checkout there are no sibling repositories).
        run: |
          python -m pip install --upgrade pip
          pip install pydantic cryptography sqlcipher3-binary pytest hatchling
          pip install \
            "harpe @ git+https://github.com/Perseus-Computing-LLC/harpe@v0.1.0-alpha.3" \
            "kibisis @ git+https://github.com/Perseus-Computing-LLC/kibisis@v0.1.0-alpha.3" \
            "argus-ledger @ git+https://github.com/Perseus-Computing-LLC/argus@v0.1.0-alpha.3"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

      - name: Run benchmark execution & claims regeneration
        # A shared runner is not the measurement machine: a timing outside its stated range is a
        # warning here, not a failure. Published figures come from load-gated runs (telarch.ai/evidence).
        env:
          TELARCH_RANGE_CHECK: warn
        run: |
          make bench
