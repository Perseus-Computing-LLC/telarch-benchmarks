[package]
name = "telarch-benchmarks"
version = "0.1.0"
edition = "2021"
authors = ["Perseus Computing LLC <contact@perseuscomputing.com>"]
license = "MIT"
default-run = "telarch-benchmarks"

[dependencies]
harpe = { path = "../harpe" }
kibisis = { path = "../kibisis" }
argus-ledger = { path = "../argus-ledger" }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
